<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Module — Брейншторм</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.16);
    --text: #f0f2f8;
    --muted: rgba(240,242,248,0.45);
    --accent: #7c6af7;
    --accent-soft: rgba(124,106,247,0.15);

    --col-int:   #3d7cf7;
    --col-int-bg: rgba(61,124,247,0.13);
    --col-user:  #a78bfa;
    --col-user-bg: rgba(167,139,250,0.13);
    --col-device:#34d399;
    --col-device-bg: rgba(52,211,153,0.13);
    --col-fin:   #fbbf24;
    --col-fin-bg: rgba(251,191,36,0.13);
    --col-ops:   #60a5fa;
    --col-ops-bg: rgba(96,165,250,0.13);
    --col-report:#86efac;
    --col-report-bg: rgba(134,239,172,0.13);
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }

  /* ── TOOLBAR ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: var(--surface); border-bottom: 1px solid var(--border2);
    display: flex; align-items: center; gap: 8px; padding: 0 16px; z-index: 100;
  }
  #toolbar h1 { font-size: 15px; font-weight: 600; color: var(--text); margin-right: 8px; white-space: nowrap; }
  .sep { width: 1px; height: 24px; background: var(--border2); margin: 0 4px; }
  .tb-btn {
    padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .tb-btn:hover { background: var(--surface2); color: var(--text); }
  .tb-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #mode-hint { font-size: 12px; color: var(--muted); margin-left: 4px; }

  /* add-node controls */
  #add-section { display: flex; gap: 6px; align-items: center; }
  #new-label { 
    padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text); font-size: 13px; width: 160px;
    outline: none;
  }
  #new-label:focus { border-color: var(--accent); }
  #color-pick {
    display: flex; gap: 4px;
  }
  .cpick {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color .1s;
  }
  .cpick.sel { border-color: #fff; }

  /* zoom controls */
  #zoom-box { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  #zoom-val { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; }

  /* ── CANVAS ── */
  #canvas {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0;
    overflow: hidden; cursor: default;
  }
  #world {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
  }
  svg#svg-lines {
    position: absolute; top: 0; left: 0;
    width: 4000px; height: 3000px;
    pointer-events: none; overflow: visible;
  }

  /* ── NODES ── */
  .node {
    position: absolute; min-width: 160px; max-width: 240px;
    border-radius: 12px; border: 1.5px solid var(--border2);
    background: var(--surface);
    box-shadow: 0 2px 16px rgba(0,0,0,.35);
    cursor: grab; user-select: none; z-index: 10;
    transition: box-shadow .15s;
  }
  .node:active { cursor: grabbing; }
  .node.selected { box-shadow: 0 0 0 2.5px var(--accent), 0 4px 24px rgba(124,106,247,.25); }
  .node-head {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    border-radius: 11px 11px 0 0;
  }
  .node-badge {
    display: inline-block; font-size: 10px; font-weight: 600;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 20px;
    margin-bottom: 5px; text-transform: uppercase;
  }
  .node-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    outline: none; border: none; background: transparent;
    width: 100%; cursor: text;
  }
  .node-title:focus { color: #fff; }
  .node-body { padding: 8px 12px 10px; }
  .node-desc {
    font-size: 12px; color: var(--muted); line-height: 1.5;
    outline: none; border: none; background: transparent;
    width: 100%; resize: none; cursor: text; font-family: inherit;
    min-height: 36px;
  }
  .node-desc:focus { color: var(--text); }

  /* connection dots */
  .dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
    cursor: crosshair; z-index: 20; opacity: 0;
    transition: opacity .15s, transform .15s;
  }
  .node:hover .dot, .dot.active { opacity: 1; }
  .dot:hover, .dot.active { transform: scale(1.4); }
  .dot-r { right: -7px; top: 50%; margin-top: -6px; }
  .dot-l { left: -7px; top: 50%; margin-top: -6px; }
  .dot-t { top: -7px; left: 50%; margin-left: -6px; }
  .dot-b { bottom: -7px; left: 50%; margin-left: -6px; }

  /* ── EDGE PANEL ── */
  #edge-panel {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 14px 16px; min-width: 220px;
    z-index: 200; font-size: 13px;
    display: none;
  }
  #edge-panel h4 { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .conn-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .conn-row:last-child { border-bottom: none; }
  .conn-names { font-size: 12px; color: var(--text); }
  .conn-del { cursor: pointer; color: #f87171; font-size: 16px; padding: 0 4px; }
  .conn-del:hover { color: #fca5a5; }

  /* SVG lines */
  .edge { stroke: var(--accent); stroke-width: 2; fill: none; opacity: .6; stroke-dasharray: 6 4; }
  .edge.solid { stroke-dasharray: none; opacity: .85; }
  marker#arr path { stroke: var(--accent); }

  /* ── CONTEXT MENU ── */
  #ctx-menu {
    position: fixed; background: var(--surface); border: 1px solid var(--border2);
    border-radius: 9px; padding: 6px 0; min-width: 160px; z-index: 300;
    display: none; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .ctx-item {
    padding: 8px 16px; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .ctx-item:hover { background: var(--surface2); }
  .ctx-item.danger { color: #f87171; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>⬡ Device Module</h1>
  <div class="sep"></div>
  <button class="tb-btn active" id="btn-move" onclick="setMode('move')">✥ Рухати</button>
  <button class="tb-btn" id="btn-connect" onclick="setMode('connect')">⤳ Зв'язок</button>
  <div class="sep"></div>

  <div id="add-section">
    <input id="new-label" placeholder="Назва нового блоку…" maxlength="40">
    <div id="color-pick">
      <div class="cpick sel" data-color="int"    style="background:var(--col-int)"    title="Інтеграція"></div>
      <div class="cpick"     data-color="user"   style="background:var(--col-user)"   title="User"></div>
      <div class="cpick"     data-color="device" style="background:var(--col-device)" title="Device"></div>
      <div class="cpick"     data-color="fin"    style="background:var(--col-fin)"    title="Фінанси"></div>
      <div class="cpick"     data-color="ops"    style="background:var(--col-ops)"    title="Операції"></div>
      <div class="cpick"     data-color="report" style="background:var(--col-report)" title="Звіти"></div>
    </div>
    <button class="tb-btn" onclick="addNodeFromInput()">+ Додати блок</button>
  </div>

  <div class="sep"></div>
  <button class="tb-btn" onclick="clearEdges()">Очистити зв'язки</button>
  <span id="mode-hint">Режим: рухати блоки</span>

  <div id="zoom-box">
    <button class="tb-btn" onclick="zoom(-0.15)">−</button>
    <span id="zoom-val">100%</span>
    <button class="tb-btn" onclick="zoom(+0.15)">+</button>
    <button class="tb-btn" onclick="resetZoom()">⊙</button>
  </div>
</div>

<div id="canvas">
  <div id="world">
    <svg id="svg-lines">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M1 1L8 5L1 9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </marker>
      </defs>
    </svg>
  </div>
</div>

<div id="edge-panel">
  <h4>Зв'язки на дошці</h4>
  <div id="edge-list"></div>
</div>

<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxEdit()">✎ Редагувати</div>
  <div class="ctx-item danger" onclick="ctxDelete()">✕ Видалити блок</div>
  <div class="ctx-item" onclick="hideCtx()">Скасувати</div>
</div>

<script>
// ── STATE ──
let mode = 'move';
let scale = 1;
let panX = 0, panY = 0;
let isPanning = false, panStart = {x:0,y:0}, panOrigin = {x:0,y:0};
let dragNode = null, dragOff = {x:0,y:0};
let connecting = null; // {nodeId, dotEl}
let edges = [];
let edgeId = 0;
let selectedColor = 'int';
let ctxTarget = null;
let nodes = {}; // id -> {x,y,color,title,desc}
let nid = 0;

const COLORS = {
  int:    {bg:'var(--col-int-bg)',    border:'var(--col-int)',    text:'var(--col-int)',    label:'Інтеграція'},
 notProiriry: {bg:#60727A,    border:#364B54,    text:#ACB2B5,    label:'Інтеграція'},
  user:   {bg:'var(--col-user-bg)',   border:'var(--col-user)',   text:'var(--col-user)',   label:'User'},
  device: {bg:'var(--col-device-bg)', border:'var(--col-device)', text:'var(--col-device)', label:'Device'},
  fin:    {bg:'var(--col-fin-bg)',     border:'var(--col-fin)',    text:'var(--col-fin)',    label:'Фінанси'},
  ops:    {bg:'var(--col-ops-bg)',     border:'var(--col-ops)',    text:'var(--col-ops)',    label:'Операції'},
  report: {bg:'var(--col-report-bg)', border:'var(--col-report)', text:'var(--col-report)', label:'Звіти'},
};

// ── INITIAL NODES ──
const INIT = [
  {id:'bamboo', x:80,   y:80,  color:'int',    title:'BambooHR',             desc:'HR-система. Звідси автоматично тягнемо дані про співробітників.'},
  {id:'itinv',  x:300,  y:80,  color:'int',    title:'IT Inventory',         desc:'База всіх фізичних пристроїв. Синхронізується автоматично.'},
  {id:'asana',  x:520,  y:80,  color:'int',    title:'Asana',                desc:'Задачі. Зберігаємо лише посилання — не дублюємо дані.'},
  {id:'bigin',  x:740,  y:80,  color:'int',    title:'Bigin CRM',            desc:'Клієнти. Умови розрахунків per client.'},
  {id:'slack',  x:960,  y:80,  color:'int',    title:'Slack NOT priority',                desc:'Автосповіщення: застарів девайс, інцидент, перевищено бюджет.'},
  {id:'looker', x:1180, y:80,  color:'int',    title:'Looker NOT priority',               desc:'BI-платформа. Отримує дані для глибоких фінансових звітів.'},
  {id:'user',   x:200,  y:300, color:'user',   title:'User (співробітник)',   desc:'Ім\'я · країна · департамент · статус · client_id · правила компенсацій'},
  {id:'device', x:700,  y:300, color:'device', title:'Device (пристрій)',     desc:'Модель · серійник · країна · вартість · постачальник · три осі часу'},
  {id:'assign', x:460,  y:280, color:'user',   title:'Assignment',           desc:'Хто отримав · що · коли · повна історія передач'},
  {id:'fin',    x:80,   y:530, color:'fin',    title:'Фінанси і нарахування', desc:'Амортизація · device fee · бонуси · заморозка компенсацій · бюджет'},
  {id:'ops',    x:400,  y:530, color:'ops',    title:'Операції',             desc:'Інциденти · девайси на продаж · доставка · документи'},
  {id:'report', x:720,  y:530, color:'report', title:'Звіти і аналітика',    desc:'KPI/OKR · по країнах · старість пристроїв · експорт у Looker'},
];

const INIT_EDGES = [
  ['bamboo','user'],['itinv','device'],['bigin','user'],
  ['asana','ops'],['slack','ops'],['looker','report'],
  ['user','assign'],['device','assign'],
  ['assign','fin'],['assign','ops'],['assign','report'],
];

// ── BUILD DOM ──
function world() { return document.getElementById('world'); }
function svgEl() { return document.getElementById('svg-lines'); }

function createNodeEl(data) {
  const c = COLORS[data.color] || COLORS.int;
  const el = document.createElement('div');
  el.className = 'node';
  el.id = 'n-'+data.id;
  el.style.left = data.x+'px';
  el.style.top  = data.y+'px';
  el.style.borderColor = c.border;
  el.innerHTML = `
    <div class="node-head" style="background:${c.bg}">
      <span class="node-badge" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">${c.label}</span>
      <div class="node-title" contenteditable="true" spellcheck="false">${data.title}</div>
    </div>
    <div class="node-body">
      <div class="node-desc" contenteditable="true" spellcheck="false">${data.desc}</div>
    </div>
    <div class="dot dot-r" data-side="r"></div>
    <div class="dot dot-l" data-side="l"></div>
    <div class="dot dot-t" data-side="t"></div>
    <div class="dot dot-b" data-side="b"></div>
  `;
  world().appendChild(el);
  attachNodeEvents(el, data.id);
  nodes[data.id] = data;
  return el;
}

function attachNodeEvents(el, id) {
  // drag
  el.addEventListener('mousedown', e => {
    if (mode !== 'move') return;
    if (e.target.classList.contains('dot')) return;
    if (e.target.getAttribute('contenteditable') === 'true') return;
    dragNode = {el, id};
    const wr = document.getElementById('canvas').getBoundingClientRect();
    const nr = el.getBoundingClientRect();
    dragOff.x = (e.clientX - wr.left - panX) / scale - parseFloat(el.style.left);
    dragOff.y = (e.clientY - wr.top  - panY) / scale - parseFloat(el.style.top);
    e.preventDefault();
    selectNode(el);
  });

  // connect dots
  el.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('mousedown', e => {
      if (mode !== 'connect') return;
      e.stopPropagation();
      if (!connecting) {
        connecting = {nodeId: id, dotEl: dot};
        dot.classList.add('active');
        document.getElementById('mode-hint').textContent = '⤳ Натисніть на крапку іншого блоку';
      } else {
        if (connecting.nodeId !== id) {
          addEdge(connecting.nodeId, id);
        }
        connecting.dotEl.classList.remove('active');
        connecting = null;
        document.getElementById('mode-hint').textContent = '⤳ Клікніть крапку першого блоку';
      }
    });
  });

  // right-click context menu
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    ctxTarget = id;
    const menu = document.getElementById('ctx-menu');
    menu.style.display = 'block';
    menu.style.left = e.clientX+'px';
    menu.style.top  = e.clientY+'px';
  });
}

function selectNode(el) {
  document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
  el.classList.add('selected');
}

// ── EDGES ──
function addEdge(fromId, toId) {
  const exists = edges.find(e => (e.from===fromId&&e.to===toId)||(e.from===toId&&e.to===fromId));
  if (exists) return;
  const id = edgeId++;
  edges.push({id, from:fromId, to:toId});
  drawEdge(id, fromId, toId);
  renderEdgePanel();
}

function drawEdge(id, fromId, toId) {
  const svg = svgEl();
  let line = document.getElementById('edge-'+id);
  if (!line) {
    line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('id','edge-'+id);
    line.setAttribute('class','edge solid');
    line.setAttribute('marker-end','url(#arr)');
    svg.appendChild(line);
  }
  const a = nodeCenter(fromId), b = nodeCenter(toId);
  if (!a||!b) return;
  line.setAttribute('x1',a.x); line.setAttribute('y1',a.y);
  line.setAttribute('x2',b.x); line.setAttribute('y2',b.y);
}

function nodeCenter(id) {
  const el = document.getElementById('n-'+id);
  if (!el) return null;
  return { x: parseFloat(el.style.left)+el.offsetWidth/2, y: parseFloat(el.style.top)+el.offsetHeight/2 };
}

function redrawEdges() {
  edges.forEach(e => drawEdge(e.id, e.from, e.to));
}

function clearEdges() {
  edges = [];
  svgEl().querySelectorAll('line').forEach(l=>l.remove());
  renderEdgePanel();
}

function deleteEdge(id) {
  edges = edges.filter(e=>e.id!==id);
  document.getElementById('edge-'+id)?.remove();
  renderEdgePanel();
}

function renderEdgePanel() {
  const panel = document.getElementById('edge-panel');
  const list  = document.getElementById('edge-list');
  if (!edges.length) { panel.style.display='none'; return; }
  panel.style.display = 'block';
  list.innerHTML = edges.map(e => {
    const ft = nodes[e.from]?.title||e.from;
    const tt = nodes[e.to]?.title||e.to;
    const fn = ft.length>18 ? ft.slice(0,16)+'…' : ft;
    const tn = tt.length>18 ? tt.slice(0,16)+'…' : tt;
    return `<div class="conn-row"><span class="conn-names">${fn} → ${tn}</span><span class="conn-del" onclick="deleteEdge(${e.id})">×</span></div>`;
  }).join('');
}

// ── MODE ──
function setMode(m) {
  mode = m;
  document.getElementById('btn-move').classList.toggle('active', m==='move');
  document.getElementById('btn-connect').classList.toggle('active', m==='connect');
  connecting = null;
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  const hints = {move:'Режим: рухати блоки', connect:'⤳ Клікніть крапку першого блоку'};
  document.getElementById('mode-hint').textContent = hints[m]||'';
}

// ── ADD NODE ──
let newNodePos = {x:200, y:200};
function addNodeFromInput() {
  const inp = document.getElementById('new-label');
  const title = inp.value.trim() || 'Новий блок';
  const id = 'custom-'+(nid++);
  newNodePos.x = (newNodePos.x+30)%900+100;
  newNodePos.y = (newNodePos.y+30)%500+100;
  createNodeEl({id, x:newNodePos.x, y:newNodePos.y, color:selectedColor, title, desc:'Опис…'});
  inp.value = '';
}
document.getElementById('new-label').addEventListener('keydown', e => { if(e.key==='Enter') addNodeFromInput(); });

// ── COLOR PICKER ──
document.querySelectorAll('.cpick').forEach(cp => {
  cp.addEventListener('click', () => {
    document.querySelectorAll('.cpick').forEach(c=>c.classList.remove('sel'));
    cp.classList.add('sel');
    selectedColor = cp.dataset.color;
  });
});

// ── ZOOM & PAN ──
function applyTransform() {
  document.getElementById('world').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
  document.getElementById('zoom-val').textContent = Math.round(scale*100)+'%';
}
function zoom(delta) {
  scale = Math.min(2.5, Math.max(0.3, scale+delta));
  applyTransform();
}
function resetZoom() { scale=1; panX=0; panY=0; applyTransform(); }

document.getElementById('canvas').addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  scale = Math.min(2.5, Math.max(0.3, scale+delta));
  applyTransform();
}, {passive:false});

// ── GLOBAL MOUSE ──
document.addEventListener('mousemove', e => {
  if (dragNode) {
    const wr = document.getElementById('canvas').getBoundingClientRect();
    const x = (e.clientX - wr.left - panX) / scale - dragOff.x;
    const y = (e.clientY - wr.top  - panY) / scale - dragOff.y;
    dragNode.el.style.left = Math.max(0,x)+'px';
    dragNode.el.style.top  = Math.max(0,y)+'px';
    nodes[dragNode.id].x = x;
    nodes[dragNode.id].y = y;
    redrawEdges();
    return;
  }
  if (isPanning) {
    panX = panOrigin.x + (e.clientX - panStart.x);
    panY = panOrigin.y + (e.clientY - panStart.y);
    applyTransform();
  }
});
document.addEventListener('mouseup', () => { dragNode=null; isPanning=false; });

// pan on canvas bg
document.getElementById('canvas').addEventListener('mousedown', e => {
  if (e.target.id==='canvas'||e.target.id==='world'||e.target.id==='svg-lines') {
    isPanning=true;
    panStart={x:e.clientX,y:e.clientY};
    panOrigin={x:panX,y:panY};
  }
});

// ── CONTEXT MENU ──
function ctxEdit() {
  const el = document.getElementById('n-'+ctxTarget);
  el?.querySelector('.node-title')?.focus();
  hideCtx();
}
function ctxDelete() {
  if (!ctxTarget) return;
  document.getElementById('n-'+ctxTarget)?.remove();
  edges = edges.filter(e => {
    if(e.from===ctxTarget||e.to===ctxTarget){ document.getElementById('edge-'+e.id)?.remove(); return false; }
    return true;
  });
  delete nodes[ctxTarget];
  renderEdgePanel();
  hideCtx();
}
function hideCtx() { document.getElementById('ctx-menu').style.display='none'; ctxTarget=null; }
document.addEventListener('click', hideCtx);

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { connecting=null; document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active')); hideCtx(); }
  if (e.key==='m'&&!e.target.getAttribute('contenteditable')) setMode('move');
  if (e.key==='c'&&!e.target.getAttribute('contenteditable')) setMode('connect');
});

// ── INIT ──
INIT.forEach(d => createNodeEl({...d}));
INIT_EDGES.forEach(([f,t]) => addEdge(f,t));
applyTransform();
</script>
</body>
</html>
